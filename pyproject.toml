[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neo-reasoner"
version = "0.52.1"
description = "A self-improving code reasoning engine with persistent semantic memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Parslee AI", email = "hello@parslee.ai"}
]
keywords = ["reasoning", "ai", "llm", "code-generation", "cli", "semantic-memory", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "datasketch>=1.6.0",
    "fastembed>=0.3.0",
    "faiss-cpu>=1.7.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    # OpenAI is the default provider, so the base install must be runnable
    # after setting OPENAI_API_KEY.
    "openai>=1.0.0",
    # tree-sitter is required: empty-catch detection, multi-language
    # god-file metrics, language_parser semantic chunking, and edge
    # extraction all depend on it. Pinned to the 0.x line of
    # tree-sitter-language-pack — 1.x changed the Parser.parse and
    # Tree.root_node APIs in incompatible ways.
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-language-pack>=0.13.0,<1.0",
]

[project.optional-dependencies]
# Upper-capped at the next major. 1.0.0 REMOVED `temperature` from
# `Messages.create()`, so every call raised a client-side TypeError before
# reaching the network — the adapter now recovers from that (see
# `_sdk_rejects_keyword`), but the cap is what stops the NEXT major from
# retiring a parameter we have not learned to drop yet. Caught by the release
# gate rather than by 2769 tests, because every adapter test mocks the SDK and
# a mock accepts any keyword.
anthropic = ["anthropic>=0.21.0,<2.0"]
openai = ["openai>=1.0.0"]
google = ["google-genai>=0.2.0"]
ollama = ["requests>=2.31.0"]
# Optional CAR (Common Agent Runtime) backend. Enables `neo serve`,
# which hosts Neo as an Agent2Agent v1.0 endpoint via car-server,
# and `neo memory observer`, which runs synthesis under CAR's agent
# supervisor.
# Kept optional so the default install path stays pure Apache-2.0 —
# car-runtime ships as a sealed binary under a separate license.
# Requires the car-server daemon (`python -m car_runtime.server`)
# running locally; see INSTALL.md.
#
# Functional minimum is 0.18.0 (the pin floor below is higher — newest
# validated): 0.16.x has the `agents_*` API but the PyO3
# binding still tries to acquire the supervisor manifest lock
# in-process, which collides with a running CarHost.app/car-server
# (Parslee-ai/car-releases#54). 0.17.0 routes those calls through
# the daemon's WS handlers when the lock is held. 0.18.0 fixes two
# observer-reliability footguns that directly hit `neo memory
# observer`: the supervisor no longer orphans a live child or storms
# restarts on a `start` issued during `Backoff` (`spawn_supervision`
# is now teardown-first + `kill_on_drop`, backoff is exponential),
# and `last_exit_code` is cleared on successful (re)start so
# `neo memory observer status` no longer shows a stale exit code
# next to a healthy `running` agent. Earlier versions still work
# for `CarAdapter`-only use, but `neo memory observer start` will
# reject them with an actionable error.
car = [
    # Tracks latest within the 0.x line: a fresh install / `pipx upgrade`
    # resolves to the newest compatible release (car-runtime is on the index).
    # Upper-capped at the next major so it does NOT silently adopt a breaking
    # 1.0 rewrite of this sealed binary. Floor raised to 0.27.0 — the latest
    # version neo is validated against — so a fresh install can't land on an
    # old 0.x. NB: car-runtime is pre-1.0, so 0.x minor bumps can still carry
    # breaking changes (see history above) — validate the observer after
    # upgrading across a minor. (The observer's *runtime* floor is a separate,
    # more permissive 0.18.0 in `memory.observer._CAR_MIN_VERSION`: the minimum
    # that is functionally footgun-free, vs. this pin's "ship latest validated".)
    "car-runtime>=0.27.0,<1.0",
    # JSON-RPC-over-WebSocket client for the A2UI surface
    # (`neo.a2ui`). The Python `car_runtime.a2ui_*` helpers are
    # in-process only; reaching the daemon's a2ui store — which is
    # what renderers subscribe to — requires speaking WS directly.
    "websockets>=12.0",
    # Cross-platform process introspection for observer orphan detection
    # (`memory.observer._find_orphan_observers`): `ps`/`ppid==1` are POSIX-only,
    # so psutil powers parent-liveness checks on Windows too. POSIX without
    # psutil falls back to `ps`.
    "psutil>=5.9.0",
]
all = [
    "anthropic>=0.21.0,<2.0",
    "openai>=1.0.0",
    "google-genai>=0.2.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    # Pinned EXACTLY, not a range. ruff is pre-1.0 and changes both its default
    # rule set and rule behavior in minor bumps, so a range means a contributor's
    # local ruff and CI's can disagree — which is how a green local tree pushed a
    # red main in 0.39.0. Bump this deliberately, with the lint delta reviewed.
    "ruff==0.16.5",
    "mypy>=1.0.0",
]

[project.scripts]
neo = "neo.cli:main"

[project.urls]
Homepage = "https://github.com/Parslee-ai/neo"
Documentation = "https://github.com/Parslee-ai/neo/blob/main/README.md"
Repository = "https://github.com/Parslee-ai/neo"
Issues = "https://github.com/Parslee-ai/neo/issues"
Changelog = "https://github.com/Parslee-ai/neo/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/neo"]

[tool.hatch.build.targets.wheel.force-include]
"construct" = "neo/construct_library"
"benchmarks" = "neo/benchmarks"

[tool.hatch.build.targets.sdist]
exclude = [
    # Redundant since 0.42.0 — `.coverage` is untracked and gitignored, so it
    # can no longer reach an sdist. Kept as belt-and-suspenders: this entry was
    # added to stop a tracked coverage database shipping in the tarball, and
    # dropping it would silently re-open that path if the file is ever
    # re-added.
    "/.coverage",
    "/papers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "-v"]
markers = [
    # The free half of the release gate: per-language selection invariants
    # (G1-inv..G3-inv), no model call. Runs in the ordinary suite AND as its
    # own named CI job so a break is legible on the PR that caused it.
    "invariants: guard-invariant battery, no LLM calls (runs on every PR)",
    # The paid half. Selecting the marker is NOT enough to spend money: the
    # module skips unless NEO_RELEASE_ROUNDTRIP=1, so an ordinary `pytest` run
    # reports them SKIPPED rather than silently omitting them. A gate nobody
    # can see is the failure mode this whole goal exists to prevent. The
    # release workflow is the only thing that sets the variable.
    # See docs/release-gate.md.
    "roundtrip: per-language LLM round trip, costs money (release flow only)",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Declared explicitly rather than inheriting ruff's defaults. Those defaults
# change between releases, and `dev` pins only `ruff>=...`, so CI silently
# adopts whatever rule set the newest ruff ships. That is not hypothetical: the
# 0.15 -> 0.16 bump turned a green tree red with 1050 errors on a commit that had
# passed six days earlier, none of them from any code change. These four are the
# set the project has actually been enforcing all along (ruff's historical
# default): pycodestyle errors + pyflakes.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
